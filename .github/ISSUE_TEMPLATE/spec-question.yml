name: Specification question
description: A point where the specification text looks open, inconsistent or unclear.
title: "[spec question] <task or clause>: <short summary>"
labels: ["spec-question"]
body:
  - type: markdown
    attributes:
      value: |
        This suite is a draft proposal for discussion and review by the DTGWG. Every task specification involved is draft.
        A point where the text is open is a question for the task force. It is recorded as a question and is not asserted in a vector or an exception.
  - type: textarea
    id: quotes
    attributes:
      label: "The text, quoted"
      description: "Each passage with its document, clause and the commit or version. For an inconsistency, quote both."
    validations:
      required: true
  - type: textarea
    id: readings
    attributes:
      label: "The readings you can see"
      description: "Each reasonable reading, and which implementations (if any) behave each way, at which commit. Describe behaviour, not people."
    validations:
      required: true
  - type: textarea
    id: vectors
    attributes:
      label: "Vectors or scenarios affected"
      description: "Ids, if known. They would be CLARIFY (not gating) while the point is open."
    validations:
      required: false
